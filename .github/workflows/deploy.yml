name: Build Flutter Web & Deploy to Vercel
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # One job per app mode, each on its own fresh runner — no shared
  # filesystem/.dart_tool/build cache between modes at all. The previous
  # single-job version built staff/customer/qr sequentially in one working
  # directory; something in Flutter's web build cache kept reusing a
  # previous mode's compiled output even after `rm -rf build/web .dart_tool`
  # between builds, so QR silently shipped stale JS with no error. Separate
  # jobs run on separate VMs, which makes that class of bug structurally
  # impossible instead of just less likely.
  build-and-deploy:
    strategy:
      fail-fast: false
      matrix:
        mode: [staff, customer, qr]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web (${{ matrix.mode }})
        run: flutter build web --release --dart-define=APP_MODE=${{ matrix.mode }}

      - name: Copy API & vercel.json
        run: |
          cp -r api build/web/api
          cp vercel.json build/web/vercel.json

      # Content sanity check — fails the build loudly instead of silently
      # deploying stale/wrong output. index.html should always exist; the
      # QR-only marker proves this specific mode's code actually compiled in
      # (catches the exact staleness bug this matrix split is meant to rule out).
      - name: Verify build contents
        run: |
          test -f build/web/index.html || { echo "❌ index.html missing from build/web"; exit 1; }
          test -f build/web/api/chat.js || { echo "❌ api/chat.js missing from build/web"; exit 1; }
          echo "main.dart.js size: $(wc -c < build/web/main.dart.js) bytes"
          if [ "${{ matrix.mode }}" = "qr" ]; then
            grep -q "Menu Assistant" build/web/main.dart.js || { echo "❌ QR build is missing the AI menu assistant — stale/wrong build, refusing to deploy"; exit 1; }
            echo "✓ QR build contains the AI menu assistant"
          fi

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Resolve Vercel project ID for this mode
        run: |
          case "${{ matrix.mode }}" in
            staff)    echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID_STAFF }}" >> "$GITHUB_ENV" ;;
            customer) echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID_CUSTOMER }}" >> "$GITHUB_ENV" ;;
            qr)       echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID_QR }}" >> "$GITHUB_ENV" ;;
          esac

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: build/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request'
        run: vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: build/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
